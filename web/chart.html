<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日足チャート — J-Quants</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2030; --panel2: #232b3d; --line: #2e3850;
    --fg: #e6ebf5; --muted: #93a0bd; --accent: #4f8cff; --up: #2bd4a0; --down: #ff5c7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif; }
  header { padding: 14px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header a.back { color: var(--accent); text-decoration: none; font-size: 13px; }
  header a.back:hover { text-decoration: underline; }
  header h1 { font-size: 18px; margin: 0; }
  header .code { font-family: ui-monospace, monospace; color: var(--muted); }
  header .last { margin-left: auto; font-size: 14px; }
  header .last b { font-size: 20px; }
  header .up { color: var(--up); } header .down { color: var(--down); }
  .ranges { padding: 10px 22px; display: flex; gap: 8px; align-items: center; }
  .ranges button { cursor: pointer; background: var(--panel2); color: var(--muted);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 12px; font-size: 13px; }
  .ranges button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #chart { width: 100%; height: calc(100vh - 130px); }
  #status { padding: 0 22px; color: var(--muted); font-size: 13px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--line);
    border-top-color: var(--accent); border-radius:50%; animation: spin .8s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header>
  <a class="back" href="/">← 検索に戻る</a>
  <h1 id="title"><span class="code" id="codeLabel"></span> <span id="nameLabel"></span></h1>
  <div class="last" id="lastBox"></div>
</header>
<div class="ranges" id="ranges">
  <span style="color:var(--muted);font-size:12px;">表示期間:</span>
  <button data-days="22">1M</button>
  <button data-days="66">3M</button>
  <button data-days="132" class="active">6M</button>
  <button data-days="264">1Y</button>
  <button data-days="0">全期間</button>
</div>
<div id="status"></div>
<div id="chart"></div>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("code") || "";
const nameParam = params.get("name") || "";
document.getElementById("codeLabel").textContent = "[" + code + "]";
document.getElementById("nameLabel").textContent = nameParam;
document.title = `${code} ${nameParam} 日足チャート`;

const el = document.getElementById("chart");
let chart, candleSeries, volumeSeries, bars = [];

function buildChart() {
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: el.clientHeight,
    layout: { background: { color: "#0f1420" }, textColor: "#e6ebf5", fontSize: 12 },
    grid: { vertLines: { color: "#1a2030" }, horzLines: { color: "#1a2030" } },
    rightPriceScale: { borderColor: "#2e3850" },
    timeScale: { borderColor: "#2e3850", timeVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    localization: { locale: "ja-JP" },
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: "#2bd4a0", downColor: "#ff5c7a", borderVisible: false,
    wickUpColor: "#2bd4a0", wickDownColor: "#ff5c7a",
  });
  volumeSeries = chart.addHistogramSeries({
    priceFormat: { type: "volume" }, priceScaleId: "",
  });
  volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
  new ResizeObserver(() => chart.resize(el.clientWidth, el.clientHeight)).observe(el);
}

function setVisible(days) {
  if (!bars.length) return;
  const last = bars[bars.length - 1].date;
  if (!days) { chart.timeScale().fitContent(); return; }
  const to = new Date(last);
  const from = new Date(to); from.setDate(from.getDate() - days * 1.5); // 暦日換算で営業日daysぶん
  chart.timeScale().setVisibleRange({ from: from.toISOString().slice(0, 10), to: last });
}

function renderLastBox() {
  if (bars.length < 2) return;
  const a = bars[bars.length - 2].close, b = bars[bars.length - 1];
  const chg = (b.close - a) / a * 100;
  const cls = chg >= 0 ? "up" : "down";
  document.getElementById("lastBox").innerHTML =
    `<span class="${cls}"><b>${b.close.toLocaleString("ja-JP")}</b> 円 ` +
    `(${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%)</span>` +
    `<div style="font-size:11px;color:var(--muted);text-align:right;">${b.date} 終値(調整後)</div>`;
}

async function load() {
  document.getElementById("status").innerHTML = `<span class="spinner"></span> 日足を取得中…`;
  try {
    const res = await fetch(`/api/bars?code=${encodeURIComponent(code)}&years=2`);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    bars = data.bars || [];
    if (data.name) document.getElementById("nameLabel").textContent = data.name;
    if (!bars.length) {
      document.getElementById("status").textContent = "この銘柄の日足データがありません。";
      return;
    }
    buildChart();
    candleSeries.setData(bars.map(b => ({
      time: b.date, open: b.open, high: b.high, low: b.low, close: b.close,
    })));
    volumeSeries.setData(bars.map(b => ({
      time: b.date, value: b.volume,
      color: b.close >= b.open ? "rgba(43,212,160,0.5)" : "rgba(255,92,122,0.5)",
    })));
    setVisible(132); // 既定6M
    renderLastBox();
    document.getElementById("status").textContent = "";
  } catch (e) {
    document.getElementById("status").innerHTML = `⚠️ エラー: ${e.message}`;
  }
}

document.getElementById("ranges").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#ranges button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  setVisible(Number(btn.dataset.days));
});

load();
</script>
</body>
</html>
