    light_compatible: true
    implemented: true
    expr: "f.dividend_yield is not None and f.dividend_yield >= 0.035"
    strength: "_ramp(f.dividend_yield*100, 3.5, 6.0)"
    reason: "配当利回り{f.dividend_yield:.1%}>=3.5%"

  - id: 8
    name: ターンアラウンド
    category: A
    data: [statements]
    light_compatible: true
    implemented: true
    expr: "f.prev_net_income is not None and f.net_income is not None and f.prev_net_income < 0 and f.net_income > 0"
