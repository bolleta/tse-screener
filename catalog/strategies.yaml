# 82-strategy investment catalog → rule engine spec
# Source: /Users/bollet/Downloads/投資戦略カタログ_80手法.md.docx
#
# Schema:
#   id: 1-82
#   name: 手法名
#   category: A-H
#   data: required data sources
#   light_compatible: bool — Light プランで判定可能か
#   implemented: bool — expr/strength を持つか
#   expr: 真偽値式。コンテキスト: `f` (StockFeatures), `_ramp(v,lo,hi)`, abs/min/max/sum
#   strength: 0-100 式 (任意)。マッチ時のみ評価。省略時はマッチで100
#   reason: 説明テンプレ。`.format(f=feat)` で展開 (算術は不可、属性アクセスのみ)
#   weight: composite_score 乗数 (デフォルト 1.0)
#
# 単位: fraction (0.15 = 15%)。PER/PBR/PEG は unitless。

strategies:
  # ===== A. Fundamentals =====
  - id: 1
    name: バリュー投資
    category: A
    data: [statements, prices]
    light_compatible: true
    implemented: true
    expr: "f.per is not None and f.pbr is not None and 0 < f.per <= 12 and 0 < f.pbr <= 1.0"
    strength: "(_ramp(f.per, 12, 5) + _ramp(f.pbr, 1.0, 0.5)) / 2"
    reason: "PER={f.per:.1f}/PBR={f.pbr:.2f}"

  - id: 2
    name: グロース投資
    category: A
    data: [statements]
    light_compatible: true
    implemented: true
    expr: "f.revenue_growth is not None and f.eps_growth is not None and max(f.revenue_growth, f.eps_growth) >= 0.20"
    strength: "_ramp(max(f.revenue_growth, f.eps_growth) * 100, 20, 50)"
    reason: "売上成長{f.revenue_growth:.1%}/EPS成長{f.eps_growth:.1%}"

  - id: 3
    name: GARP
    category: A
    data: [statements]
    light_compatible: true
    implemented: true
    expr: "f.peg is not None and f.eps_growth is not None and 0 < f.peg <= 1.0 and f.eps_growth >= 0.10"
    strength: "(_ramp(f.peg, 1.0, 0.3) + _ramp(f.eps_growth*100, 10, 30)) / 2"
    reason: "PEG={f.peg:.2f}/EPS成長{f.eps_growth:.1%}"

  - id: 4
    name: クオリティ投資
    category: A
    data: [statements]
    light_compatible: true
    implemented: true
    expr: "f.roe is not None and f.op_margin is not None and f.equity_ratio is not None and f.roe >= 0.15 and f.op_margin >= 0.15 and f.equity_ratio >= 0.50"
    strength: "(_ramp(f.roe*100, 15, 30) + _ramp(f.op_margin*100, 15, 30) + _ramp(f.equity_ratio*100, 50, 80)) / 3"
    reason: "ROE={f.roe:.1%}/営利率{f.op_margin:.1%}/自己資本{f.equity_ratio:.1%}"

  - id: 5
    name: ディープバリュー/ネットネット
    category: A
    data: [statements]
    light_compatible: true
    implemented: true
    expr: "f.pbr is not None and 0 < f.pbr <= 0.5"
    strength: "_ramp(f.pbr, 0.5, 0.2)"
    reason: "PBR={f.pbr:.2f}<0.5"

  - id: 6
    name: 配当成長投資
    category: A
    data: [statements]
    light_compatible: true
    implemented: true
    expr: "f.dividend_yield is not None and f.dividend_growth_3y is not None and f.dividend_yield > 0.02 and f.dividend_growth_3y > 0.05"
    strength: "(_ramp(f.dividend_yield*100, 2, 5) + _ramp(f.dividend_growth_3y*100, 5, 15)) / 2"
    reason: "配当利回り{f.dividend_yield:.1%}/3年CAGR{f.dividend_growth_3y:.1%}"

  - id: 7
    name: 高配当株投資
    category: A
