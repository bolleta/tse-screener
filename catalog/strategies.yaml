  # ===== B. Technical / Price Action =====
  - id: 11
    name: トレンドフォロー(順張り)
    category: B
    data: [prices]
    light_compatible: true
    implemented: true
    expr: "f.close is not None and f.sma200 is not None and f.sma50 is not None and f.close > f.sma200 and f.sma50 > f.sma200"
    strength: "(_ramp((f.close/f.sma200 - 1)*100, 0, 25) + _ramp((f.sma50/f.sma200 - 1)*100, 0, 10)) / 2"
    reason: "終値>200MA かつ 50MA>200MA"

  - id: 12
    name: 逆張り(平均回帰)
    category: B
    data: [prices]
    light_compatible: true
    implemented: true
    expr: "f.rsi14 is not None and f.rsi14 <= 30"
    strength: "_ramp(f.rsi14, 30, 15)"
    reason: "RSI(14)={f.rsi14:.1f}<=30"

  - id: 13
    name: ブレイクアウト
    category: B
    data: [prices]
    light_compatible: true
    implemented: true
    expr: "f.pct_52w_high is not None and f.vol_ratio is not None and f.pct_52w_high >= 0.98 and f.vol_ratio >= 1.5"
    strength: "(_ramp(f.pct_52w_high*100, 98, 100) + _ramp(f.vol_ratio, 1.5, 3.0)) / 2"
    reason: "52週高値比{f.pct_52w_high:.1%}/出来高{f.vol_ratio:.2f}倍"

  - id: 14
    name: 押し目買い
    category: B
    data: [prices]
    light_compatible: true
    implemented: true
    expr: "f.close is not None and f.high60 is not None and f.sma50 is not None and f.close > f.sma50 and 0.05 < (f.high60-f.close)/f.high60 < 0.15"
    strength: "_ramp((f.high60 - f.close) / f.high60 * 100, 5, 12)"
    reason: "60日高値{f.high60:.0f}→終値{f.close:.0f}押し目・SMA50上"

  - id: 15
    name: モメンタム/相対強度
    category: B
    data: [prices]
    light_compatible: true
    implemented: true
    expr: "f.pct_52w_high is not None and f.sma200 is not None and f.close is not None and f.pct_52w_high >= 0.90 and f.close >= f.sma200 * 1.10"
    strength: "(_ramp(f.pct_52w_high*100, 90, 100) + _ramp((f.close/f.sma200 - 1)*100, 10, 40)) / 2"
    reason: "52週高値比{f.pct_52w_high:.1%}/SMA200上方乖離"

  - id: 16
    name: レンジ/ボックス
    category: B
    data: [prices]
    light_compatible: true
    implemented: true
    expr: "f.rsi14 is not None and f.close is not None and f.sma50 is not None and 40 <= f.rsi14 <= 60 and abs(f.close/f.sma50 - 1) <= 0.03"
    strength: "(100 - abs(f.rsi14 - 50) * 4 + (3 - abs(f.close/f.sma50 - 1)*100) / 3 * 100) / 2"
    reason: "RSI={f.rsi14:.0f}/SMA50近接"

  - id: 17
    name: チャートパターン(コイル)
    category: B
    data: [prices]
    light_compatible: true
