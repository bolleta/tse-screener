    data: [prices]
    light_compatible: true
    implemented: true
    expr: "f.sma50 is not None and f.sma200 is not None and 0 <= (f.sma50/f.sma200 - 1) * 100 <= 3"
    strength: "_ramp(3 - (f.sma50/f.sma200 - 1)*100, 0, 3)"
    reason: "50/200MA GC接近"

