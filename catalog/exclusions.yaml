# 銘柄除外リスト (手動メンテ)
#
# J-Quants Light は MBO / TOB / 公開買付 / 上場廃止予定 などのコーポレートアクション
# 情報を取得できない (Standard 以上 + ニュースフィードが必要)。
# そのためこれらは「機械判定では拾えないが投資対象から外すべき銘柄」として
# ここに手動で登録する。
#
# ここに登録した銘柄は以下すべてから除外される:
#   - src/pipeline.py        : スコアリング結果 (output CSV) から除外
#   - scripts/build_textbook.py : 教科書の該当銘柄 TOP N から除外
#   - web/app.py             : Web UI の全ビューから除外 (トグルで表示可)
#
# code は J-Quants の銘柄コード。4桁 (例: 7490) でも 5桁 (例: 74900) でも可。
#   内部で末尾0を補完して照合するため、どちらの表記でもマッチする。
# reason / source / date は監査用。reason は UI に表示される。

exclusions:
  # 例:
  # - code: "74900"
  #   name: "日新商事"
  #   reason: "MBO予定 (上場廃止見込み)"
  #   source: "適時開示 2026-05-28"
  #   date: "2026-05-28"
